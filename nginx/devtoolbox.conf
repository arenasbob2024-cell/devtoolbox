# Rate limiting for bots
limit_req_zone $binary_remote_addr zone=aibot:10m rate=20r/s;

server {
    server_name viadreams.cc www.viadreams.cc;

    # SECURITY: Block .git access
    location ~ /\.git {
        return 444;
    }

    # Block hidden files
    location ~ /\. {
        return 444;
    }

    # Block WordPress attack paths
    location ~* ^/(xmlrpc\.php|wp-login\.php|wp-admin|wp-content|wp-includes|wp-json|wp-cron\.php|index\.php) {
        return 444;
    }

    # Block common attack paths
    location ~* \.(php|asp|aspx|cgi)$ {
        return 444;
    }

    # MiroFish 前端 - 备用路径
    location /mf/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # MiroFish 前端
    location /mirofish/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # MiroFish API
    location /mirofish-api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    # === 410 Gone: aitoolvs.com legacy URLs (site discontinued) ===
    location ~ ^/(best-ai-|top-10-ai-|8-best-ai-|chatgpt-|does-chatgpt-|how-to-use-bolt|complete-guide-|perplexity-ai-vs|notion-ai-vs-|cursor-ai-|elevenlabs-|midjourney-|melhores-|sora-vs-|free-midjourney|what-is-the-best-ai|claude-vs-chatgpt|claude-alternatives|mejores-generadores) {
        return 410;
    }

    # ads.txt (no ad network configured)
    location = /ads.txt {
        return 404;
    }


    # Sitemaps and robots.txt are served by Next.js via proxy (public/ dir)
    # Previously used Nginx alias but Google GSC couldn't fetch them.
    # Now proxied through Next.js which Google can crawl successfully.

    # Main proxy
    location / {
        limit_req zone=aibot burst=50 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/viadreams.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/viadreams.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = viadreams.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name viadreams.cc www.viadreams.cc;
    return 404; # managed by Certbot
}
