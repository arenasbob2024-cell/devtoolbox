name: Adsterra Revenue Goal

# Workflow template for verifying the real Adsterra revenue gate.
# To enable it, commit this file as:
# .github/workflows/adsterra-revenue-goal.yml
#
# Required GitHub repository secrets:
# - ADSTERRA_API_KEY
# - ADSTERRA_ADS_TXT_SELLER_LINE

on:
  schedule:
    # Runs after the previous UTC day has had time to settle in Adsterra reports.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Rolling days to verify'
        required: false
        default: '7'
      target:
        description: 'Required average daily revenue in USD'
        required: false
        default: '10'

concurrency:
  group: adsterra-revenue-goal
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADSTERRA_API_KEY: ${{ secrets.ADSTERRA_API_KEY }}
      ADSTERRA_ADS_TXT_SELLER_LINE: ${{ secrets.ADSTERRA_ADS_TXT_SELLER_LINE }}
      DAYS: ${{ github.event.inputs.days || '7' }}
      TARGET: ${{ github.event.inputs.target || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required secrets
        run: |
          test -n "$ADSTERRA_API_KEY" || { echo "::error title=Missing secret::Add ADSTERRA_API_KEY in GitHub repository secrets."; exit 1; }
          test -n "$ADSTERRA_ADS_TXT_SELLER_LINE" || { echo "::error title=Missing secret::Add ADSTERRA_ADS_TXT_SELLER_LINE in GitHub repository secrets."; exit 1; }

      - name: Run revenue gate
        run: |
          set +e
          npm run adsterra:gate -- --site-url=https://viadreams.cc --days="$DAYS" --target="$TARGET" --json > adsterra-revenue-gate.json
          gate_status=$?
          npm run adsterra:gate -- --site-url=https://viadreams.cc --days="$DAYS" --target="$TARGET" --markdown > adsterra-revenue-gate.md || true
          echo "GATE_STATUS=$gate_status" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          function readJson(path) {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              return null;
            }
          }
          const gate = readJson('adsterra-revenue-gate.json');
          if (gate) {
            console.log(`gate status: ${gate.status}`);
            console.log(`ads.txt status: ${gate.adsTxt?.status}`);
            console.log(`live seller line: ${gate.adsTxt?.live?.hasValidLine ? 'present' : 'missing'}`);
            if (gate.goal) {
              console.log(`period: ${gate.goal.start} to ${gate.goal.end} (${gate.goal.days} days)`);
              console.log(`average daily revenue: $${gate.goal.averageDailyRevenue.toFixed(2)} / day`);
              console.log(`target: $${gate.goal.targetDailyRevenue.toFixed(2)} / day`);
            }
            if (gate.failures?.length) {
              console.log('failures:');
              for (const failure of gate.failures) console.log(`- ${failure}`);
            }
          }
          NODE

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsterra-revenue-goal
          path: |
            adsterra-revenue-gate.json
            adsterra-revenue-gate.md
          if-no-files-found: ignore

      - name: Fail on unmet revenue gate
        if: always()
        run: |
          test "${GATE_STATUS:-1}" -eq 0 || { echo "::error title=Revenue gate failed::Live ads.txt, required inventory, or rolling Adsterra revenue did not pass."; exit 1; }
